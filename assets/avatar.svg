<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f72585" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00ffcc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="hexGrid" width="30" height="52" patternUnits="userSpaceOnUse">
      <path d="M15 0 L30 8.66 L30 26 L15 34.64 L0 26 L0 8.66 Z M15 52 L30 43.34 L30 26 L15 34.64 L0 26 L0 43.34 Z" fill="none" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" fill="url(#cyberBg)" rx="24"/>
  <rect width="500" height="500" fill="url(#hexGrid)" rx="24"/>

  <!-- Tech Circles & HUD Rings -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.3" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#9d4edd" stroke-width="2" stroke-dasharray="16 12 4 12" opacity="0.4" />
  <circle cx="250" cy="250" r="230" fill="none" stroke="#00f5d4" stroke-width="1" opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#00d4ff" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 450 80 L 450 50 L 420 50" fill="none" stroke="#00d4ff" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 50 420 L 50 450 L 80 450" fill="none" stroke="#9d4edd" stroke-width="3" filter="url(#neonGlow)"/>
  <path d="M 450 420 L 450 450 L 420 450" fill="none" stroke="#9d4edd" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Gamer Character Silhouette / Vector -->
  <!-- Hoodie / Shoulders -->
  <path d="M 120 440 C 130 360, 170 330, 210 320 L 250 335 L 290 320 C 330 330, 370 360, 380 440 Z" fill="#1e2433" stroke="#2a3349" stroke-width="2" />
  <!-- Hoodie inner shadow & collar neon trims -->
  <path d="M 190 335 L 250 375 L 310 335" fill="none" stroke="#00d4ff" stroke-width="2.5" filter="url(#neonGlow)" />
  <path d="M 250 375 L 250 440" fill="none" stroke="#9d4edd" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Neck -->
  <rect x="232" y="270" width="36" height="50" rx="6" fill="#e0a98b" />
  <path d="M 232 290 L 268 290" stroke="#00d4ff" stroke-width="1" opacity="0.4" />

  <!-- Head Base -->
  <path d="M 195 210 C 195 150, 305 150, 305 210 C 305 260, 280 295, 250 295 C 220 295, 195 260, 195 210 Z" fill="#f0be9d" />
  
  <!-- Cyber Hair / Undercut -->
  <path d="M 185 200 C 185 130, 240 100, 315 110 C 320 150, 310 180, 310 180 C 290 145, 240 140, 205 170 C 195 180, 190 200, 185 200 Z" fill="#0f172a" />
  <path d="M 210 120 C 250 115, 290 135, 305 165" fill="none" stroke="#00f5d4" stroke-width="3" filter="url(#neonGlow)" />
  <path d="M 230 110 C 270 105, 315 130, 320 150" fill="none" stroke="#f72585" stroke-width="2" opacity="0.8" />

  <!-- Headset Band -->
  <path d="M 180 185 C 180 125, 320 125, 320 185" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" />
  <path d="M 180 185 C 180 125, 320 125, 320 185" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Headset Earcups with Glow Rings -->
  <g transform="translate(170, 180)">
    <rect x="-8" y="0" width="22" height="48" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <circle cx="3" cy="24" r="8" fill="#0b0f19" stroke="#00d4ff" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="3" cy="24" r="3" fill="#00d4ff" />
  </g>
  <g transform="translate(316, 180)">
    <rect x="-8" y="0" width="22" height="48" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1.5" />
    <circle cx="3" cy="24" r="8" fill="#0b0f19" stroke="#00d4ff" stroke-width="2" filter="url(#neonGlow)" />
    <circle cx="3" cy="24" r="3" fill="#00d4ff" />
  </g>

  <!-- Headset Mic -->
  <path d="M 182 220 C 182 260, 215 270, 230 268" fill="none" stroke="#374151" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="232" cy="268" r="4.5" fill="#f72585" filter="url(#neonGlow)" />

  <!-- Cyber Visor / High-Tech Glasses -->
  <path d="M 200 205 L 300 205 L 290 235 L 250 242 L 210 235 Z" fill="url(#visorGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#intenseGlow)" opacity="0.95" />
  <line x1="210" y1="220" x2="290" y2="220" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="10 4" opacity="0.8" />
  <circle cx="282" cy="216" r="2.5" fill="#ffffff" />
  <circle cx="272" cy="216" r="2.5" fill="#ffffff" />

  <!-- Nose & Mouth subtle lines -->
  <path d="M 250 248 L 247 257 L 253 257" fill="none" stroke="#c98a6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 240 272 C 246 276, 254 276, 260 272" fill="none" stroke="#b07052" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cybernetic Facial Tattoo / Circuitry -->
  <path d="M 215 250 L 210 260 L 202 263" fill="none" stroke="#00f5d4" stroke-width="1.5" filter="url(#neonGlow)" opacity="0.8" />
  <circle cx="202" cy="263" r="1.5" fill="#00f5d4" />

  <!-- Bottom Data HUD Badges -->
  <rect x="180" y="445" width="140" height="26" rx="13" fill="#0d1424" stroke="#00d4ff" stroke-width="1.5" />
  <circle cx="196" cy="458" r="4" fill="#00ff9d" filter="url(#neonGlow)" />
  <text x="210" y="462" fill="#00d4ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">ONLINE // DEV</text>
</svg>
