<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="50%" stop-color="#240046" />
      <stop offset="100%" stop-color="#3c096c" />
    </linearGradient>
    <linearGradient id="synthSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9e00" />
      <stop offset="40%" stop-color="#ff0054" />
      <stop offset="100%" stop-color="#9d0208" />
    </linearGradient>
    <linearGradient id="neonSpeed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="synthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="220" fill="url(#cyberSky)" />

  <!-- Retro Synthwave Sun with blinds -->
  <g transform="translate(300, 160)">
    <circle cx="0" cy="0" r="75" fill="url(#synthSun)" filter="url(#synthGlow)" />
    <!-- Sun horizontal slices -->
    <rect x="-80" y="-10" width="160" height="4" fill="#1b0a2a" />
    <rect x="-80" y="8" width="160" height="6" fill="#1b0a2a" />
    <rect x="-80" y="28" width="160" height="8" fill="#1b0a2a" />
    <rect x="-80" y="50" width="160" height="11" fill="#1b0a2a" />
  </g>

  <!-- Distant Cyber City Skyline -->
  <path d="M 0 190 L 30 190 L 30 150 L 50 150 L 50 180 L 80 180 L 80 130 L 110 130 L 110 170 L 140 170 L 140 120 L 160 120 L 160 185 L 200 185 L 200 140 L 230 140 L 230 190 L 370 190 L 370 135 L 400 135 L 400 175 L 430 175 L 430 115 L 460 115 L 460 160 L 490 160 L 490 145 L 530 145 L 530 185 L 600 185 L 600 220 L 0 220 Z" fill="#0d041c" opacity="0.9" />

  <!-- Perspective 3D Grid Highway Ground -->
  <rect y="210" width="600" height="150" fill="#080210" />
  
  <!-- Perspective Grid lines -->
  <!-- Horizon -->
  <line x1="0" y1="210" x2="600" y2="210" stroke="#f72585" stroke-width="2.5" filter="url(#synthGlow)" />

  <!-- Vanishing Perspective Lines originating from (300, 210) -->
  <line x1="300" y1="210" x2="-100" y2="360" stroke="#7209b7" stroke-width="1.5" />
  <line x1="300" y1="210" x2="20" y2="360" stroke="#00f5d4" stroke-width="1.8" />
  <line x1="300" y1="210" x2="140" y2="360" stroke="#00b4d8" stroke-width="1.5" />
  <line x1="300" y1="210" x2="240" y2="360" stroke="#f72585" stroke-width="2" />
  <line x1="300" y1="210" x2="360" y2="360" stroke="#f72585" stroke-width="2" />
  <line x1="300" y1="210" x2="460" y2="360" stroke="#00b4d8" stroke-width="1.5" />
  <line x1="300" y1="210" x2="580" y2="360" stroke="#00f5d4" stroke-width="1.8" />
  <line x1="300" y1="210" x2="700" y2="360" stroke="#7209b7" stroke-width="1.5" />

  <!-- Horizontal Grid Bars (Spacing expands with depth) -->
  <line x1="0" y1="218" x2="600" y2="218" stroke="#00f5d4" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="230" x2="600" y2="230" stroke="#00f5d4" stroke-width="1.2" opacity="0.5" />
  <line x1="0" y1="248" x2="600" y2="248" stroke="#00f5d4" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="274" x2="600" y2="274" stroke="#00f5d4" stroke-width="1.8" opacity="0.8" />
  <line x1="0" y1="312" x2="600" y2="312" stroke="#00f5d4" stroke-width="2.2" opacity="0.9" />

  <!-- Futuristic Hovercraft Racer -->
  <g transform="translate(240, 245)">
    <!-- Thruster trails -->
    <path d="M 30 50 L 10 90 L 40 55 Z" fill="#00f5d4" filter="url(#synthGlow)" />
    <path d="M 90 50 L 110 90 L 80 55 Z" fill="#00f5d4" filter="url(#synthGlow)" />
    <path d="M 60 52 L 60 100" stroke="#ff007f" stroke-width="4" filter="url(#synthGlow)" />

    <!-- Craft Body (Angular Hover Ship) -->
    <polygon points="60,0 95,35 110,48 78,48 60,42 42,48 10,48 25,35" fill="#161d31" stroke="#00d4ff" stroke-width="2" />
    <!-- Cockpit Canopy Glass -->
    <polygon points="60,10 75,32 45,32" fill="#00ffcc" filter="url(#synthGlow)" opacity="0.9" />
    <!-- Wing neon accents -->
    <line x1="18" y1="42" x2="42" y2="42" stroke="#f72585" stroke-width="2" filter="url(#synthGlow)" />
    <line x1="78" y1="42" x2="102" y2="42" stroke="#f72585" stroke-width="2" filter="url(#synthGlow)" />
  </g>

  <!-- Speed Blur Flares -->
  <line x1="20" y1="320" x2="180" y2="320" stroke="#f72585" stroke-width="2" opacity="0.6" stroke-dasharray="20 10" />
  <line x1="420" y1="330" x2="580" y2="330" stroke="#00f5d4" stroke-width="2" opacity="0.6" stroke-dasharray="30 15" />

  <!-- HUD Overlay -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#060913" fill-opacity="0.85" stroke="#f72585" stroke-width="1" />
  <circle cx="34" cy="34" r="5" fill="#00ff9d" filter="url(#synthGlow)" />
  <text x="46" y="38" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">380 KM/H</text>

  <rect x="470" y="20" width="110" height="28" rx="6" fill="#060913" fill-opacity="0.85" stroke="#00d4ff" stroke-width="1" />
  <text x="484" y="38" fill="#00d4ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">GODOT 4</text>
</svg>
