<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="40%" stop-color="#140b2a" />
      <stop offset="80%" stop-color="#2a0845" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>
    <linearGradient id="crystalGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="terrainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151b2e" />
      <stop offset="100%" stop-color="#080c16" />
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Ambient -->
  <rect width="600" height="360" fill="url(#skyGrad)" />

  <!-- Celestial Moons / Portals -->
  <circle cx="450" cy="90" r="45" fill="none" stroke="#7928ca" stroke-width="3" opacity="0.6" filter="url(#p1Glow)" />
  <circle cx="450" cy="90" r="35" fill="#f72585" opacity="0.4" filter="url(#p1Glow)" />
  <circle cx="450" cy="90" r="25" fill="#ffffff" opacity="0.8" />
  
  <!-- Starfield / Particles -->
  <circle cx="50" cy="40" r="1.5" fill="#00d4ff" opacity="0.8"/>
  <circle cx="120" cy="80" r="2" fill="#fff" opacity="0.9"/>
  <circle cx="210" cy="30" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="280" cy="95" r="1.5" fill="#00d4ff" opacity="0.7"/>
  <circle cx="340" cy="50" r="2" fill="#9d4edd" opacity="0.8"/>
  <circle cx="530" cy="60" r="1.5" fill="#fff" opacity="0.6"/>

  <!-- Distant Mountains -->
  <polygon points="0,260 90,170 180,240 290,140 400,250 510,160 600,240 600,360 0,360" fill="#11182c" opacity="0.7" />
  <polygon points="40,280 160,190 260,260 360,180 480,270 600,200 600,360 0,360" fill="url(#terrainGrad)" />

  <!-- Giant Floating Power Crystals -->
  <polygon points="300,70 325,140 300,200 275,140" fill="url(#crystalGlow)" filter="url(#p1Glow)" opacity="0.95" />
  <line x1="300" y1="70" x2="300" y2="200" stroke="#ffffff" stroke-width="2" opacity="0.7" />

  <polygon points="190,130 205,170 190,205 175,170" fill="url(#crystalGlow)" opacity="0.8" />
  <polygon points="410,120 428,165 410,200 392,165" fill="url(#crystalGlow)" opacity="0.8" />

  <!-- Floating Island Platforms -->
  <polygon points="240,210 360,210 320,240 280,240" fill="#1b243b" stroke="#00d4ff" stroke-width="1.5" />
  
  <!-- Foreground Terrain -->
  <path d="M 0 290 Q 150 250 300 285 T 600 280 L 600 360 L 0 360 Z" fill="#0b0f19" />
  <line x1="0" y1="290" x2="600" y2="280" stroke="#00d4ff" stroke-width="1.5" opacity="0.4" />

  <!-- Hero Character Silhouette with glowing sword -->
  <g transform="translate(290, 240)">
    <circle cx="10" cy="5" r="5" fill="#000" />
    <path d="M 5 10 L 15 10 L 18 30 L 2 30 Z" fill="#000" />
    <!-- Cape fluttering -->
    <path d="M 5 12 Q -8 20 -15 28 L -5 32 Z" fill="#140b2a" />
    <!-- Glowing Blade -->
    <line x1="22" y1="28" x2="35" y2="-5" stroke="#00f5d4" stroke-width="2.5" filter="url(#p1Glow)" />
  </g>

  <!-- Game HUD Overlay elements -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#060913" fill-opacity="0.8" stroke="#00d4ff" stroke-width="1" />
  <circle cx="34" cy="34" r="5" fill="#f72585" filter="url(#p1Glow)" />
  <text x="46" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ACT 1: RUNES</text>

  <rect x="470" y="20" width="110" height="28" rx="6" fill="#060913" fill-opacity="0.8" stroke="#7928ca" stroke-width="1" />
  <text x="484" y="38" fill="#00ffcc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">UNITY 3D</text>
</svg>
